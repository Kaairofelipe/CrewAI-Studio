services:
  postgres:
    image: postgres:16
    container_name: kalainne-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalainne
      POSTGRES_USER: kalainne
      POSTGRES_PASSWORD: kalainne123
    ports:
      - "5433:5432"
    volumes:
      - kalainne_pgdata:/var/lib/postgresql/data

volumes:
  kalainne_pgdata:
